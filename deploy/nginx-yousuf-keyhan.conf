server {
    listen 9060;
    server_name 157.180.86.19;
    client_max_body_size 50M;

    root /var/www/yousuf-keyhan-mis/frontend/dist;
    index index.html;

    # NestJS API + uploads + swagger (/api) — same origin so auth cookies work on HTTP
    location ~ ^/(auth|users|roles|permissions|customers|varieties|stores|seasons|rice_warehouse|rice_sales|rice_charities|reports|process_rice|paddy_process|jwali|investors|farmer_owned_paddy|expenses|expense-categories|entering_paddy|employees|currencies|campany_owned_paddy|cash|audit-logs|sarafi|uploads|health|api)(/|$) {
        proxy_pass http://127.0.0.1:9061;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 120s;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
